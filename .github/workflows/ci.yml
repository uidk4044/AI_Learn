name: CI Build & Push

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t xiaoxingan99/myapp:$IMAGE_TAG ./projects/project1-ci-cd/app
          docker tag xiaoxingan99/myapp:$IMAGE_TAG xiaoxingan99/myapp:latest
  
      - name: Push image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker push xiaoxingan99/myapp:$IMAGE_TAG
          docker push xiaoxingan99/myapp:latest