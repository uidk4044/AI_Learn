name: CD - Deploy Production

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    # ⭐关键：触发 GitHub approval gate
    environment:
      name: production

    defaults:
      run:
        shell: powershell

    steps:
      # 1. checkout（可选，但保留规范）
      - name: Checkout
        uses: actions/checkout@v4

      # 2. deploy（核心）
      - name: Deploy
        run: |
          $IMAGE_TAG = $env:GITHUB_SHA.Substring(0,7)

          Write-Host "Deploying image: $IMAGE_TAG"

          docker pull xiaoxingan99/myapp:$IMAGE_TAG

          $env:TAG = $IMAGE_TAG

          docker compose -f .\docker-compose.yml up -d

          # 保存版本（用于 rollback）
          Set-Content -Path .last_deploy -Value $IMAGE_TAG

      # 3. health check（验证）
      - name: Health Check
        run: |
          Invoke-WebRequest http://localhost:8080/health -UseBasicParsing