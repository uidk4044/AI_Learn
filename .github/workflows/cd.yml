name: CD - Deploy Local

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull & Deploy
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker pull ${{ secrets.DOCKER_USERNAME }}/myapp:$IMAGE_TAG

          export TAG=$IMAGE_TAG
          docker compose -f ./projects/project1-ci-cd/app/docker-compose.yml up -d

          curl -f http://localhost:8080/health