name: CD - Deploy Local

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          $IMAGE_TAG = $env:GITHUB_SHA.Substring(0,7)

          docker pull xiaoxingan99/myapp:$IMAGE_TAG

          $env:TAG = $IMAGE_TAG

          docker compose -f .\docker-compose.yml up -d

      - name: Health Check
        run: |
          $response = Invoke-WebRequest http://localhost:8080/health -UseBasicParsing

          if ($response.StatusCode -ne 200) {
            throw "Health check failed"
          }

          Write-Host "Health check OK"