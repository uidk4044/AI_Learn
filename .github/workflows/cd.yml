name: CD - Deploy Local

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: pwsh   # ⭐关键：禁止 bash

    steps:
      - name: Deploy
        run: |
          $IMAGE_TAG = $env:GITHUB_SHA.Substring(0,7)

          docker pull xiaoxingan99/myapp:$IMAGE_TAG

          $env:TAG = $IMAGE_TAG
          docker compose -f .\projects\project1-ci-cd\app\docker-compose.yml up -d

          curl http://localhost:8080/health