name: CD - Deploy Local

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: bash   # ⭐关键：统一 bash

    steps:
      - name: Deploy
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          echo "Pull image..."
          docker pull xiaoxingan99/myapp:$IMAGE_TAG

          echo "Start compose..."
          export TAG=$IMAGE_TAG
          docker compose -f ./projects/project1-ci-cd/app/docker-compose.yml up -d

          echo "Health check..."
          curl -f http://localhost:8080/health