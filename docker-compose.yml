services:
  web1:
    image: xiaoxingan99/myapp:${TAG}
    environment:
      - BUILD_VERSION=${TAG}
      - DATABASE_URL=postgresql://user:password@db:5432/mydb
      - INSTANCE=web1
      - SLOW=true
  
    expose:
      - "3000"
  
    depends_on:
      - db
  
  web2:
    image: xiaoxingan99/myapp:${TAG}
    environment:
      - BUILD_VERSION=${TAG}
      - DATABASE_URL=postgresql://user:password@db:5432/mydb
      - INSTANCE=web2
      - SLOW=false
  
    expose:
      - "3000"
  
    depends_on:
      - db
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web1
      - web2
      
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"      