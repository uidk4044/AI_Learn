services:
  web:
    # image: xiaoxingan99/myapp:d05c63c643e6eafdf564661114e3c92f7377aa35
    # image: xiaoxingan99/myapp:latest
    # build: ./projects/project1-ci-cd/app
    image: xiaoxingan99/myapp:${TAG}
    environment:
      - BUILD_VERSION=${TAG}    
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app
    #ports:
    #  - "3000:3000"
    expose:
      - "3000"
    depends_on:
      - db
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"      